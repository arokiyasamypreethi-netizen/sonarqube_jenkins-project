# Unique key for this project inside SonarQube
sonar.projectKey=devops-bootcamp-sample
sonar.projectName=DevOps Bootcamp Sample

# Where the scanner should look for source code (root of the repo)
sonar.sources=.

# Exclude test files from being scanned as "source"
sonar.exclusions=**/test_*.py,**/*_test.py

# Language + encoding
sonar.language=py
sonar.sourceEncoding=UTF-8
